# blob_db stages a whole erase block in .bss; the MX25R6435F's is 64 KB.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# zephyr-ubi's heap: 8 B per erase block (128 of 64 KB here, so 1 KB) plus a
# handle and scratch buffer at attach and a second pair during a format. The
# default assumes 4 KB blocks and would reserve 20 KB.
CONFIG_BLOB_DB_UBI_HEAP_SIZE=6144
