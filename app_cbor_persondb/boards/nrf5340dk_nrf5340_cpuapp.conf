# blob_db stages a whole erase block in .bss; the MX25R6435F's is 64 KB.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# UBI static PEB pool, sized to this geometry: the mx25r64's 8 MB partition in
# 64 KB erase blocks is 128 PEBs, less CONFIG_UBI_DEV_HDR_NR_OF_RES_PEBS (2).
# The default of 14 builds cleanly and then fails to attach; the pool costs
# 16 B per PEB, so this is sized to the part rather than to the maximum.
CONFIG_UBI_MAX_NR_OF_DATA_PEBS=126
