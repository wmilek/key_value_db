CONFIG_LOG=y
CONFIG_APP_CBOR_PERSONDB_LOG_LEVEL_INF=y

# The storage slice this app uses: L1 + L1.5 + the L2 Map provider. kvdb (L3)
# is deliberately absent. The application is two L2 containers -- one people
# map, one credential map -- with both roots in one app-owned superblock under
# a single rootreg key. L3 gives a database a name and a backend record; this
# app needs neither, and taking it would put a kvdb instance around each
# container and a registry entry behind each instance. See DESIGN.md §12.
CONFIG_BLOB_DB=y
CONFIG_BLOB_ROOTREG=y
CONFIG_BLOB_CONTAINER_KVHASH=y

# CBOR — Zephyr's own codec. Canonical encoding keeps a record's bytes a pure
# function of its content, which is what lets verification compare encodings
# rather than decoded structs.
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# kvhash derives both its bucket size and its bucket count from this one
# symbol: a bucket may hold MAX_PAYLOAD bytes and a map (MAX_PAYLOAD-8)/8
# buckets, so map capacity is ~MAX_PAYLOAD^2/8. blob_db_mount() checks that the
# value is usable on the target geometry (FINDINGS.md B9/B10).
#
# It must be large enough that ONE people map holds the dataset, because the
# app is two containers and no longer shards (DESIGN.md §12.2). 16384 puts the
# fullest bucket at 30 % of the ceiling -- the same posture as the 66 % the
# sixteen-shard build kept, with the margin measured the same way
# (tools/sizing.py).
#
# It also caps the store at 9 670 persons, 49.9 % of the part. The directory is
# a 16 384 B blob and blob_db must place each rewritten copy in one erase block;
# past half-full it cannot, and a first insert into a fresh bucket fails while
# 1 KB blobs still fit. That is K13, and it is why the 10 000-person benchmark
# scale no longer fits. 8192 would hold 11 787 -- by running the fullest bucket
# at 99 % of a silent, unrecoverable cliff (K2). Capacity is not the only axis.
#
# It is NOT set to the 32 722 B the geometry sustains, and the reason is a
# finding rather than a preference. At 32 722 the map takes its maximum 4089
# buckets, so the bucket directory is a 32 720 B blob -- and two copies of it
# plus their slot headers are 65 484 B of a 65 488 B erase block. The directory
# then owns an entire block, blob_db compacts on every rewrite, and the fill
# dies at person 36 with -ENOSPC. See FINDINGS.md K12: the geometry's largest
# payload builds a map that cannot be written to.
#
# What 16384 still costs is left in plain sight: kvhash reads the WHOLE
# directory on every get, set and delete (K11), so 2047 buckets = 16 384 B read
# per operation, 3.8x the bytes the sixteen-shard build moved. That is the
# measurement (RESULTS.md), not a knob to tune back down.
CONFIG_BLOB_DB_MAX_PAYLOAD_LEN=16384

# Count flash operations and bytes at the storage seam. Without this the app
# can only *model* what it costs the flash — and the model that held before
# blob_db learned to walk buckets by slot header ("one whole sector per map
# operation") was wrong by 20x afterwards. Measure, do not model.
CONFIG_BLOB_DB_IOSTATS=y

# Keep the storage stack quiet so per-op logging does not perturb timings.
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y

# Sized from measured ARM frames (-fstack-usage), not guessed. The deepest
# chain is the write path:
#
#   scenario_bench 2464 + persondb_person_put 824 + kvhash_set 88
#                       + blob_db_update 64 + append_slot 16430  =  19 870 B
#
# append_slot alone is 83 % of that, because blob_db builds every slot in a
# CONFIG_BLOB_DB_MAX_PAYLOAD_LEN + 46 byte *stack* frame (FINDINGS.md B5,
# job 3). That frame used to be 4200 B and a 12 KB stack held it. Raising the
# payload so one map can hold the dataset multiplies it by four -- B5 job 3
# went from a remark to the dominant term in this application's RAM budget,
# which is the finding, not an argument for sharding again.
#
# Staging the slot in the existing .bss scratch -- Stage 1 of the large-payloads
# proposal -- would take this back to ~3.5 KB.
#
# 28 KB leaves ~1.4x margin over the measured worst case.
CONFIG_MAIN_STACK_SIZE=28672
