CONFIG_LOG=y
CONFIG_APP_CBOR_PERSONDB_LOG_LEVEL_INF=y

# The storage slice this app uses: L1 + L1.5 + the L2 Map provider. kvdb (L3)
# is deliberately absent — a sharded dataset does not fit its one-instance-per-
# name model, and sharding is what keeps a lookup at 4 756 B instead of 11 458 B
# or more. Re-checked against main at 1821328: the boot-I/O and registry-
# capacity arguments that also appeared here have expired. See DESIGN.md §12.1.
CONFIG_BLOB_DB=y
CONFIG_BLOB_ROOTREG=y
CONFIG_BLOB_CONTAINER_KVHASH=y

# CBOR — Zephyr's own codec. Canonical encoding keeps a record's bytes a pure
# function of its content, which is what lets verification compare encodings
# rather than decoded structs.
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# kvhash derives both its bucket size and its bucket count from this one
# symbol: capacity is MAX_PAYLOAD^2/8, so 4096 is what puts a map at ~2.09 MB
# and sixteen of them within reach of a 4 MiB dataset. blob_db_mount() checks
# that this value is actually usable on the target geometry (FINDINGS.md
# B9/B10); the app used to assert it and no longer needs to.
#
# 4096 is no longer the Kconfig ceiling — the geometry sustains 32 746 B here,
# which would fit the whole dataset in one map. It stays at 4096 on purpose:
# the directory is read on every operation (K11) and it is this symbol, so a
# larger payload buys capacity nobody needs and pays for it on every lookup.
# DESIGN.md §12.1 has the sweep; tools/sizing.py reproduces it.
CONFIG_BLOB_DB_MAX_PAYLOAD_LEN=4096

# Count flash operations and bytes at the storage seam. Without this the app
# can only *model* what it costs the flash — and the model that held before
# blob_db learned to walk buckets by slot header ("one whole sector per map
# operation") was wrong by 20x afterwards. Measure, do not model.
CONFIG_BLOB_DB_IOSTATS=y

# Keep the storage stack quiet so per-op logging does not perturb timings.
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y

# Sized from measured ARM frames (-fstack-usage), not guessed. The deepest
# chain is the write path:
#
#   scenario_bench 2464 + persondb_person_put 824 + kvhash_set 88
#                       + blob_db_update 64 + append_slot 4200  =  7640 B
#
# append_slot alone is 55 % of that, because blob_db builds every slot in a
# CONFIG_BLOB_DB_MAX_PAYLOAD_LEN + 46 byte *stack* frame (FINDINGS.md B5,
# job 3). Staging it in the existing .bss scratch — Stage 1 of the
# large-payloads proposal — would take this app's requirement to ~3.5 KB.
#
# 12 KB leaves ~1.5x margin over the measured worst case.
CONFIG_MAIN_STACK_SIZE=12288
