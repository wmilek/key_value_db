# The storage_partition sits on the MX25R64 QSPI NOR (see the overlay), whose
# sectors are 64 KB. Grow blob_db's sector buffer to fit.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# UBI static PEB pool, sized to this geometry: an 8 MB partition in 64 KB erase
# blocks is 128 PEBs, less CONFIG_UBI_DEV_HDR_NR_OF_RES_PEBS (2).
CONFIG_UBI_MAX_NR_OF_DATA_PEBS=126
