# The sample calls blob_db_erase_all() at boot (CONFIG_SAMPLE_KVHASH_FRESH_START).
# That path invalidates bucket headers by programming 0x00 over already
# programmed magic bytes (1->0 only — legal on real NOR without an erase); the
# flash simulator rejects program-over-non-erased by default, so allow it.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
