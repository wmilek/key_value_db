# The storage stack this sample needs, and nothing else.

# L1 — the blob store every container is built on.
CONFIG_BLOB_DB=y

# L1.5 — the root registry, where the sample's map root id is remembered
# across reboots.
CONFIG_BLOB_ROOTREG=y

# L2 — the container this sample demonstrates.
CONFIG_BLOB_CONTAINER_KVHASH=y

# Errors are reported by the sample itself, on the console; keep the library
# log at warning level so the narration stays readable.
CONFIG_LOG=y
CONFIG_SAMPLE_KVHASH_LOG_LEVEL_INF=y
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y

# On a virgin store the UBI backend logs one "No volumes present on device"
# error per attach probe before blob_db formats the volume — expected, benign,
# and it buries the first step of the narration. Drop the CONFIG_UBI_LOG_LEVEL
# line below to see it (every failure the sample can hit is reported by the
# sample itself, as the return code of the call that produced it).
CONFIG_UBI_LOG_LEVEL_OFF=y

# blob_db stack-allocates sector-sized buffers per operation.
CONFIG_MAIN_STACK_SIZE=32768
