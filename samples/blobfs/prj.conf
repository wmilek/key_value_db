# The storage stack this sample needs, and nothing else.
#
# blob_db is not listed: the kvdb,blob-db node in boards/<board>.overlay
# switches it on and says where the store lives. The fstab node next to it
# mounts blobfs at boot, so the sample's main() calls no init function.

# L3 — blobfs, and its glue to Zephyr's file system API.
CONFIG_FILE_SYSTEM=y
CONFIG_BLOBDB_BLOBFS=y
CONFIG_BLOBFS_FS_INTEROP=y

# Errors are reported by the sample itself, on the console; keep the library
# log at warning level so the narration stays readable.
CONFIG_LOG=y
CONFIG_SAMPLE_BLOBFS_LOG_LEVEL_INF=y
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y
CONFIG_BLOBDB_BLOBFS_LOG_LEVEL_WRN=y

# The VFS core logs every failed fs_open() as an error, including the -ENOENT
# that step 2 expects on the first boot. The sample reports it itself.
CONFIG_FS_LOG_LEVEL_OFF=y

# On a virgin store UBI logs that the partition holds no UBI device before
# blob_db formats it: expected, and noise here.
CONFIG_UBI_LOG_LEVEL_OFF=y

# blob_db stack-allocates sector-sized buffers per operation. The automount
# runs in the init thread, which is main's, before main() starts.
CONFIG_MAIN_STACK_SIZE=32768
