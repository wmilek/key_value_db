# The Kconfig half of "native_sim, shaped like the nRF5340-DK's MX25R6435F".
# Use it together with geometry/mx25r64.overlay — the overlay sets the
# devicetree geometry, and these are the build-time bounds that must be able
# to accommodate it.
#
#   west build -b native_sim key_value_db/app_perf \
#     -DEXTRA_DTC_OVERLAY_FILE=$PWD/key_value_db/app_perf_l0/geometry/mx25r64.overlay \
#     -DEXTRA_CONF_FILE=$PWD/key_value_db/app_perf_l0/geometry/mx25r64.conf
#
# Without the first line blob_db refuses to mount ("sector size 65536 exceeds
# CONFIG_BLOB_DB_SECTOR_BUF_SIZE"), which is the same wall a real board hits
# when its board conf is missing.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# UBI's static PEB pool, sized to this geometry the way the DK board file
# sizes it: 8 MB in 64 KB blocks is 128 PEBs less the 2 reserved for headers.
# Harmless in a flash_area build; required in a UBI one.
CONFIG_UBI_MAX_NR_OF_DATA_PEBS=126
