CONFIG_LOG=y
CONFIG_APP_PERF_L0_LOG_LEVEL_INF=y

# This benchmark deliberately does NOT enable BLOB_DB. It measures the L0
# provider the stack sits on, so nothing above L0 is linked in and nothing
# above L0 can perturb the timings.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# One static buffer of CONFIG_APP_PERF_L0_MAX_XFER bytes lives in .bss; the
# stack only carries the sector-descriptor array. Still generous, because a
# native_sim frame is wider than a Cortex-M one.
CONFIG_MAIN_STACK_SIZE=8192
