# The flash simulator refuses to program a unit twice by default. The write
# sweep never rewrites a programmed byte — every sweep point erases first —
# but the read-region setup programs a boundary chunk twice when the transfer
# size does not divide the block. Allow it, as the other benchmark apps do.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# native_sim's clock measures SIMULATED time, and host CPU work costs none of
# it: without this, every span below is timed as exactly 0 ns and the sweep
# produces an empty model. The simulator's timing model is a flat per-call
# cost with no per-byte term, so what a native_sim fit recovers is
# `fixed = MIN_*_TIME_US, per-byte = 0` — which is the right answer about the
# simulator and a useless one about any real part.
#
# It is enabled here so the run exercises the whole pipeline end to end, and
# so `tools/l0_timing.py simconf` has something to compare against. The
# numbers below are Zephyr's defaults; feed a hardware model to `simconf` to
# get values that make native_sim's wall-clock resemble the target.
CONFIG_FLASH_SIMULATOR_SIMULATE_TIMING=y
CONFIG_FLASH_SIMULATOR_MIN_READ_TIME_US=2
CONFIG_FLASH_SIMULATOR_MIN_WRITE_TIME_US=100
CONFIG_FLASH_SIMULATOR_MIN_ERASE_TIME_US=2000
