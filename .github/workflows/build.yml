name: Build & test

# Runs entirely inside the official Zephyr CI Docker image
# (ghcr.io/zephyrproject-rtos/ci) — it ships west, the Zephyr SDK, and the
# native_sim host tools, so no per-run toolchain setup is needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-sim:
    name: native_sim tests (twister, both backends)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:latest
      options: --user root
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: key_value_db
          persist-credentials: false

      - name: Initialize west workspace
        run: |
          git config --global --add safe.directory '*'
          west init -l key_value_db
          west update --narrow -o=--depth=1

      # Twister builds every sample and *runs* every ztest suite on the host.
      # Each storage suite has two configurations (see tests/lib/*/testcase.yaml):
      # the default flash_area backend and a `.ubi` variant, so both backends
      # are exercised at runtime, not just compiled.
      - name: Twister — build & run tests (native_sim, both backends)
        run: |
          west twister -T key_value_db -p native_sim -v --inline-logs

      - name: Test summary
        if: always()
        run: |
          python3 key_value_db/scripts/twister_summary.py \
            twister-out/twister.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload twister reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-native_sim
          path: |
            twister-out/twister.json
            twister-out/twister.xml
            twister-out/twister.log
            twister-out/**/handler.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build app on the UBI backend (native_sim)
        run: |
          west build -p always -b native_sim -d build/kvdb_ubi key_value_db/app -- \
            -DCONFIG_BLOB_DB_BACKEND_UBI=y \
            -DCONFIG_UBI_MAX_NR_OF_DATA_PEBS=2046

  cross-build:
    name: nrf5340dk cross-build (both backends)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:latest
      options: --user root
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: key_value_db
          persist-credentials: false

      - name: Initialize west workspace
        run: |
          git config --global --add safe.directory '*'
          west init -l key_value_db
          west update --narrow -o=--depth=1

      - name: Build app — flash_area backend (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_flash key_value_db/app

      - name: Build app — UBI backend (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_ubi key_value_db/app -- \
            -DCONFIG_BLOB_DB_BACKEND_UBI=y \
            -DCONFIG_UBI_MAX_NR_OF_DATA_PEBS=126

      - name: Build app — kvdb L3 (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_kvdb key_value_db/app -- \
            -DCONFIG_BLOBDB_KVDB=y
