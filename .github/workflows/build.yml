name: Build

# Runs entirely inside the official Zephyr CI Docker image
# (ghcr.io/zephyrproject-rtos/ci) — it ships west, the Zephyr SDK, and the
# native_sim host tools, so no per-run toolchain setup is needed.

# Two triggers, two jobs:
#   push (any branch)  -> build the BRANCH HEAD. Developer feedback, and the
#                         only CI that still runs while a PR is conflicted —
#                         a pull_request build needs a merge ref GitHub cannot
#                         create for a conflicted PR, so it produces no runs
#                         at all.
#   pull_request       -> build the MERGE RESULT (refs/pull/N/merge). The gate:
#                         what will actually land, semantic conflicts included.
# native_sim carries the tests and runs on both. The cross-builds are
# compile-only, so they run at the gate and on main, not on every branch push.
on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-sim:
    name: native_sim (twister + flash_area backend)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:latest
      options: --user root
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: key_value_db
          persist-credentials: false

      - name: Initialize west workspace
        run: |
          git config --global --add safe.directory '*'
          west init -l key_value_db
          west update --narrow -o=--depth=1

      # blob_db defaults to the UBI backend, so this is what the apps and the
      # suites without an explicit backend run on. tests/lib/blob_db pins both
      # backends per scenario and therefore covers flash_area at runtime here
      # too.
      - name: Twister — apps & tests (native_sim, default = UBI backend)
        run: |
          west twister -T key_value_db -p native_sim -v --inline-logs

      # The apps above are only ever built on the default backend. Build one on
      # flash_area so the non-default backend does not rot in application
      # builds — it is still a supported option, just no longer the default.
      - name: Build app on the flash_area backend (native_sim)
        run: |
          west build -p always -b native_sim -d build/kvdb_flash key_value_db/app -- \
            -DCONFIG_BLOB_DB_BACKEND_FLASH_AREA=y

  cross-build:
    name: nrf5340dk cross-build (both backends)
    # Compile-only, and cheap to fix late: run it where it gates a merge or
    # protects main, not on every feature-branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:latest
      options: --user root
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: key_value_db
          persist-credentials: false

      - name: Initialize west workspace
        run: |
          git config --global --add safe.directory '*'
          west init -l key_value_db
          west update --narrow -o=--depth=1

      - name: Build app — flash_area backend (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_flash key_value_db/app

      - name: Build app — UBI backend (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_ubi key_value_db/app -- \
            -DCONFIG_BLOB_DB_BACKEND_UBI=y \
            -DCONFIG_UBI_MAX_NR_OF_DATA_PEBS=126

      - name: Build app — kvdb L3 (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_kvdb key_value_db/app -- \
            -DCONFIG_BLOBDB_KVDB=y

      # app_perf is the binary that gets flashed to produce the numbers in
      # app_perf/RESULTS.md, and it exercises paths `app` does not: segmented
      # large objects, blob_db_write(), and the I/O counters. Until this step
      # existed it was never compiled for the target in CI, so "ready to run
      # on the DK" rested on someone's last successful local build.
      - name: Build app_perf (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_perf \
            key_value_db/app_perf

      # app_perf_l0 produces the L0 cost model that turns a native_sim run
      # into a predicted hardware time, so it is flashed for exactly the same
      # reason app_perf is. It links no storage stack, which is the point:
      # nothing above L0 can perturb its timings, and nothing above L0 can
      # keep it compiling either, so it needs its own build step.
      - name: Build app_perf_l0 (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_perf_l0 \
            key_value_db/app_perf_l0

      # Same reasoning for app_cbor_persondb: both frontends, because the shell
      # one pulls in a subsystem the benchmark build never links.
      - name: Build app_cbor_persondb — benchmark frontend (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_persondb \
            key_value_db/app_cbor_persondb

      - name: Build app_cbor_persondb — shell frontend (ARM)
        run: |
          west build -p always -b nrf5340dk/nrf5340/cpuapp -d build/nrf_persondb_shell \
            key_value_db/app_cbor_persondb -- \
            -DCONFIG_APP_CBOR_PERSONDB_FRONTEND_SHELL=y
