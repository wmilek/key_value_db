CONFIG_LOG=y
CONFIG_APP_PERF_YCSB_LOG_LEVEL_INF=y

CONFIG_BLOB_DB=y
CONFIG_BLOBDB_KVDB=y

# The Zipfian generator is Gray's method, which needs pow(). Zephyr's minimal
# libc has no libm.
CONFIG_REQUIRES_FULL_LIBC=y

# Sized for the shipped workload, not picked round. At the YCSB defaults —
# 1000 records of 10 x 100 B — a kvhash entry is 4 + 14 + 1000 = 1018 B, the
# app derives 512 buckets (README.md §Sizing), and the fullest bucket is
# predicted at 8 entries = 8144 B. 16384 clears that with 2x margin and is the
# value app_cbor_persondb already proved usable on the DK's 64 KB geometry:
# blob_db must fit a payload twice between the bucket header and the sector
# end, and 2 x (16384 + 14) fits a 64 KB block.
#
# It costs what it costs, in plain sight: the bucket directory is read whole on
# every get, set and delete, so 512 buckets is 4104 B read per operation before
# the bucket itself. That is the measurement this app reports, not a knob to
# tune until the number looks good.
CONFIG_BLOB_DB_MAX_PAYLOAD_LEN=16384

# The load-bearing option. On native_sim the flash simulator models no latency,
# so every wall-clock figure rounds to zero and these counters are the only
# output the benchmark has; on the DK they are what turns ops/s into an
# amplification figure that a reader can compare against another store.
CONFIG_BLOB_DB_IOSTATS=y

# Keep the storage stack quiet so per-op logging does not perturb the timing
# loop (and UART overrun does not eat the benchmark lines).
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_BLOBDB_KVDB_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y

# blob_db builds every slot in a CONFIG_BLOB_DB_MAX_PAYLOAD_LEN + 46 byte stack
# frame (app_cbor_persondb/FINDINGS.md B5), so the 16 KB payload above puts a
# ~16.5 KB frame on the write path. 32 KB leaves ~2x margin over it.
CONFIG_MAIN_STACK_SIZE=32768
