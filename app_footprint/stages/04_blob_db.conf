# + blob_db (L1) on its default UBI backend. From here on main.c calls
# blob_db, and blob_db calls UBI.
CONFIG_BLOB_DB=y
CONFIG_BLOB_DB_BACKEND_UBI=y

# The DK's partition geometry, as in app_cbor_persondb: 64 KB erase blocks.
# RAM only; neither changes code size.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536
CONFIG_BLOB_DB_UBI_HEAP_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=0
