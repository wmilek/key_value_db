# + zephyr-ubi, driven directly, with the PSA Crypto provider (Mbed TLS) that
# seals its headers with AES-CMAC under HKDF-SHA256 keys. These are the two
# symbols CONFIG_BLOB_DB_BACKEND_UBI selects; nothing more is enabled here.
CONFIG_UBI=y
CONFIG_PSA_CRYPTO=y

# UBI's bookkeeping comes from the system heap. 6 KB is what blob_db reserves
# for it on this geometry (CONFIG_BLOB_DB_UBI_HEAP_SIZE).
CONFIG_HEAP_MEM_POOL_SIZE=6144
