# The smallest app_cbor_persondb that still runs its benchmark and prints its
# report on the nRF5340-DK. Applied on top of app_cbor_persondb as shipped,
# with persondb_minimal.overlay. RESULTS.md §4 has the step-by-step cost.

# Raw partition instead of UBI: UBI and PSA Crypto (Mbed TLS) leave the image.
# Changes the on-flash format and drops UBI's wear leveling and header MACs.
CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y

# No logging; the report goes out through printk.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# No flash counters: the "flash ops" columns of the report read 0.
CONFIG_BLOB_DB_IOSTATS=n

# The small formatter. The report prints 64-bit values (PRIu64, %llu), so the
# integral range must stay full, which is the default.
CONFIG_CBPRINTF_NANO=y
CONFIG_CBPRINTF_FULL_INTEGRAL=y

# Link-time optimisation across the whole image.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Drivers and kernel features the app does not use. QSPI and UART pins go
# through pinctrl, not GPIO. Nothing calls malloc once Mbed TLS is gone.
CONFIG_GPIO=n
CONFIG_SOC_FLASH_NRF=n
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_TIMESLICING=n

# Safety nets: no MPU stack guard and no fault dump. A main-stack overflow
# (CONFIG_MAIN_STACK_SIZE, sized at 1.4x the measured worst case) now
# corrupts memory silently instead of faulting.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_EXCEPTION_DEBUG=n
CONFIG_FAULT_DUMP=0
