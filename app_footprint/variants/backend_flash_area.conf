# blob_db on the raw partition instead of UBI. Used with stages/03_ubi.conf
# left out, so neither UBI nor PSA Crypto is in the image.
CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y

# logring selects ENTROPY_GENERATOR, but the nRF5340 application core has no
# entropy driver: with UBI the PSA Crypto build falls back to the test RNG, and
# without it sys_rand_get() does not link. Give this build the same test RNG
# the UBI builds get, so the comparison is like for like.
CONFIG_TEST_RANDOM_GENERATOR=y
