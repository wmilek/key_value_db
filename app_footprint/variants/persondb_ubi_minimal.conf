# app_cbor_persondb on UBI with the storage stack trimmed: no logging, no
# diagnostics, and only the PSA Crypto that zephyr-ubi calls. Zephyr itself
# is left as shipped. Pass persondb_ubi_psa.h as
# CONFIG_TF_PSA_CRYPTO_USER_CONFIG_FILE on the command line: a .conf file
# cannot name it by a relative path. RESULTS.md §5 has the build command and
# the cost of each step.

# No logging. persondb's blob_db, rootreg and kvhash already log at WRN only;
# this takes the logging core and every UBI and blob_db string out too.
CONFIG_LOG=n

# No diagnostics: blob_db's flash counters. The "flash ops" columns of the
# report read 0. (The inspect API and the shell commands are already off.)
CONFIG_BLOB_DB_IOSTATS=n

# PSA random numbers straight from Zephyr's RNG instead of Mbed TLS's
# entropy pool and HMAC_DRBG. zephyr-ubi draws one random word, the image
# sequence number, when it formats a device. The nRF5340 application core has
# no CSPRNG driver, so this keeps the test generator the shipped build already
# uses (FINDINGS F2); with a real entropy driver drop the last two lines.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG=y
CONFIG_TEST_RANDOM_GENERATOR=y
