# blob_db_erase_all() (the geometry-change wipe path) invalidates bucket
# headers by programming 0x00 over already-programmed magic bytes (1->0 only —
# legal on real NOR without an erase). The flash simulator rejects
# program-over-non-erased by default; allow it so the wipe works on native_sim.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# The flash simulator models no latency, so on native_sim every bench line
# rounds to zero and the I/O counters are the only figure that means
# anything. The enumeration phases (count, walk) print them per phase; the
# DK conf leaves this off so its timings stay comparable with earlier
# RESULTS.md captures.
CONFIG_BLOB_DB_IOSTATS=y
