CONFIG_LOG=y
CONFIG_APP_PERF_KVDB_LOG_LEVEL_INF=y

CONFIG_BLOB_DB=y
CONFIG_BLOBDB_KVDB=y

# kvhash packs a whole bucket into one blob payload; with 64 keys over 32
# buckets a bucket can hold several ~32 B entries, so give payloads room
# (also lifts the bucket-directory cap to 127 buckets).
CONFIG_BLOB_DB_MAX_PAYLOAD_LEN=1024

# Keep the storage stack quiet so per-op logging does not perturb timings.
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_BLOBDB_KVDB_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y

# blob_db stack-allocates sector-sized buffers per op.
CONFIG_MAIN_STACK_SIZE=32768
