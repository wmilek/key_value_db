CONFIG_LOG=y
CONFIG_APP_PERF_LOG_LEVEL_INF=y

CONFIG_BLOB_DB=y

# Keep blob_db quiet so the timing loop is not perturbed by per-op log
# messages (and UART overrun does not eat the benchmark line).
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y

# blob_db stack-allocates a slot buffer per op; roomy main stack keeps
# native_sim's frame overhead safe alongside it.
CONFIG_MAIN_STACK_SIZE=32768

# Exercise the large-object paths (segmented storage, pread, pwrite) as well
# as the small-blob ones. Raises BLOB_DB_MAX_PAYLOAD_LEN's default to 2016 and
# bumps the on-flash format major to 2 — neither affects the small-blob phases,
# whose slot sizes follow the payload actually written.
CONFIG_BLOB_DB_LARGE_PAYLOADS=y

# Count flash operations and bytes. On native_sim this is the only meaningful
# output the benchmark has — the flash simulator models no latency, so every
# wall-clock figure rounds to zero.
CONFIG_BLOB_DB_IOSTATS=y
