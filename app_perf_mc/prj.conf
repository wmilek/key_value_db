CONFIG_LOG=y
CONFIG_APP_PERF_MC_LOG_LEVEL_INF=y

# blob_db is switched on by the kvdb,blob-db node in boards/<board>.overlay.
CONFIG_BLOB_ROOTREG=y

# Keep library logging quiet so the timing loops are not perturbed and the
# UART does not overrun.
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y

# Model container keeps two 256 B images on the stack; blob_db buffers are
# static. Same headroom as the other apps.
CONFIG_MAIN_STACK_SIZE=32768
