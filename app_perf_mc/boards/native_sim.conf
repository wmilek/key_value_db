# blob_db_erase_all() invalidates bucket headers by programming 0x00 over
# already-programmed magic bytes (1->0 only — legal on real NOR without an
# erase). The flash simulator rejects program-over-non-erased by default;
# allow it so the benchmark's erase_all-between-phases works on native_sim.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# The overlay gives the simulated flash the DK's 64 KB erase blocks; blob_db
# refuses to mount a sector larger than its sector buffer. Same UBI heap as
# the DK conf, for the same 128-block geometry.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536
CONFIG_BLOB_DB_UBI_HEAP_SIZE=6144

# The flash simulator models no latency, so on native_sim every bench line
# rounds to zero and the I/O counters are the only figure that means
# anything: each bench line is followed by its phase's `io` line. The DK conf
# leaves this off so its timings stay comparable with earlier RESULTS.md
# captures.
CONFIG_BLOB_DB_IOSTATS=y
