# blobfs_ubi with blob_db's large payloads on. blobfs still stores a file as
# one inline payload, so this only raises the file cap, via the default
# MAX_PAYLOAD_LEN (256 -> 2016); segmented objects are not used by blobfs.
CONFIG_BLOB_DB=y
CONFIG_BLOB_DB_LARGE_PAYLOADS=y
CONFIG_BLOBDB_KVDB=y
CONFIG_BLOBDB_BLOBFS=y
CONFIG_FILE_SYSTEM=y
CONFIG_BLOBFS_FS_INTEROP=y
