# Count every flash operation at the driver, under both stacks alike.
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_FLASH_SIMULATOR_STATS=y
CONFIG_FLASH_SIMULATOR_STAT_PAGE_COUNT=256
# The mx25r64 geometry (64 KB blocks): see the overlay.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536
CONFIG_BLOB_DB_UBI_HEAP_SIZE=6144
CONFIG_MAIN_STACK_SIZE=65536
# Real NOR lets a program clear bits in already-programmed bytes; UBI relies
# on it to invalidate a header on erase (littlefs never does it).
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
