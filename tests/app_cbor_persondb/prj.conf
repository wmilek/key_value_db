CONFIG_ZTEST=y
CONFIG_LOG=y

# The application's storage slice (app_cbor_persondb/prj.conf).
CONFIG_BLOB_DB=y
CONFIG_BLOB_ROOTREG=y
CONFIG_BLOB_CONTAINER_KVHASH=y
CONFIG_BLOB_CONTAINER_SET_OVER_MAP=y
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# The application's payload, on the application's native_sim geometry
# (boards/ is copied from app_cbor_persondb/boards/).
CONFIG_BLOB_DB_MAX_PAYLOAD_LEN=16384

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
