common:
  tags: [storage, blobfs, filesystem]
  platform_allow: native_sim
tests:
  lib.blobfs: {}
  # The same suite over blob_db's RAM slot index, each indexed answer
  # cross-checked against the walk.
  lib.blobfs.slot_index:
    extra_configs:
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      # native_sim's 4 KB erase blocks make about 2 000 buckets.
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  # The on-flash format does not depend on the name limit: the whole suite
  # again with longer names (the VFS name field raised to match).
  lib.blobfs.name_len_32:
    extra_configs:
      - CONFIG_BLOBFS_MAX_NAME_LEN=32
      - CONFIG_FILE_SYSTEM_MAX_FILE_NAME=32
