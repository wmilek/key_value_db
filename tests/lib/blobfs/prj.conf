CONFIG_ZTEST=y

CONFIG_BLOB_DB=y
CONFIG_BLOB_ROOTREG=y
CONFIG_BLOBDB_BLOBFS=y

# The interop shim under test: blobfs registered with Zephyr's VFS.
CONFIG_FILE_SYSTEM=y
CONFIG_BLOBFS_FS_INTEROP=y

# blob_db compaction nests two 4 KB scratch buffers under a 4 KB bucket buffer.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_LOG=y

# kvhash_test_cut_after: fail kvhash's writes from a chosen one on, to make a
# rename fail part way (test_rename_failure_*).
CONFIG_BLOB_CONTAINER_KVHASH_TEST_HOOKS=y
