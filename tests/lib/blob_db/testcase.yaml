common:
  tags: [storage, blob_db]
  platform_allow: native_sim
  # src/power_cut.c replays a compaction once per byte it writes, with three
  # mounts each; on UBI that alone takes most of a minute (twister's default).
  timeout: 240
# blob_db defaults to the UBI backend, but most of this suite injects faults by
# writing the raw partition at offsets that are only blob_db's on flash_area
# (see SKIP_UNLESS_RAW_PARTITION in src/main.c). The first three scenarios
# therefore pin flash_area so the injection keeps its meaning; lib.blob_db.ubi
# runs the same suite on the shipped default with those cases skipping
# themselves. The backend is named per scenario rather than in `common` because
# the two are a Kconfig choice and must not both be set.
tests:
  lib.blob_db:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
  # The read-only `blob_db` shell commands. Building them here is what keeps
  # lib/blob_db/blob_db_shell.c compiling; the suite itself runs unchanged.
  lib.blob_db.shell:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_SHELL=y
      - CONFIG_BLOB_DB_SHELL=y
  # Opt-in recovery from unusable masters: mount erases the whole store, as
  # blob_db_format() would, instead of refusing with -EIO (the default the
  # other flash_area scenarios exercise).
  lib.blob_db.autoformat:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_AUTOFORMAT_ON_CORRUPT=y
  # Segmented large objects. Bumps the on-flash format major, so this config
  # also covers that older software refuses such a store.
  lib.blob_db.large_payloads:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_LARGE_PAYLOADS=y
      - CONFIG_MAIN_STACK_SIZE=32768
      # Crash injection at each step of the segmented write sequence
      # (proposal §6.4). Kept in the same config as the rest of the
      # large-object tests so the commit-point claim is covered by the
      # config that ships it, not by a config nothing else uses.
      - CONFIG_BLOB_DB_TEST_CRASH_HOOKS=y
  # The shipped default: UBI with atomic replace, single-slot payloads.
  # Everything that goes through the API runs here; the raw-partition
  # injection cases skip themselves, because under UBI those offsets are UBI's
  # device header rather than blob_db's masters. Keeping this scenario means the default is
  # exercised by the library's own suite and not only by the apps.
  #
  # LARGE_PAYLOADS is deliberately absent, and cannot simply be added here:
  # UBI spends 128 B per PEB on its two headers, so the LEB blob_db sees is
  # 3968 B rather than 4096. The rebind rule caps a payload at
  # (3968 - 16) / 2 - 14 = 1962 B, while enabling LARGE_PAYLOADS raises
  # MAX_PAYLOAD_LEN to 2016 — mount then refuses with -ENOTSUP, correctly.
  # The pair is only reachable on this geometry by also lowering
  # MAX_PAYLOAD_LEN to <= 1962. The DK's 64 KB blocks have room to spare and
  # are unaffected, which is why app_perf_blob_db runs both options there.
  lib.blob_db.ubi:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      # zephyr-ubi's own bookkeeping checks after every call: meant for
      # tests, and these are the scenarios that drive UBI hardest.
      - CONFIG_UBI_SELF_CHECKS=y
  # The same suite with the key supplied by the application, as a product
  # would: src/ubi.c defines blob_db_ubi_ikm_key() and overrides the weak
  # blob_db_ubi_state_check(), which turns on the cases that hand blob_db
  # a wrong key and a refused rollback check.
  lib.blob_db.ubi.app_key:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      # zephyr-ubi's own bookkeeping checks after every call: meant for
      # tests, and these are the scenarios that drive UBI hardest.
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_KEY_APP=y
  # An application written before the key moved to blob_db_ikm_key(): the
  # deprecated option and hook (blob_db_ubi_ikm_key()) still build and key UBI.
  lib.blob_db.ubi.app_key.deprecated:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_UBI_KEY_APP=y
  # UBI compacting through the scratch-sector protocol instead of
  # ubi_leb_change() (CONFIG_BLOB_DB_UBI_ATOMIC_REPLACE=n). Not the default,
  # but mount still recovers a compaction it left half done, so a store
  # written this way must keep working; src/power_cut.c cuts the power inside
  # that protocol here, as it does inside ubi_leb_change() on the default.
  lib.blob_db.ubi.scratch_compaction:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      # zephyr-ubi's own bookkeeping checks after every call: meant for
      # tests, and these are the scenarios that drive UBI hardest.
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_UBI_ATOMIC_REPLACE=n
  # The RAM slot index (CONFIG_BLOB_DB_SLOT_INDEX), with every indexed answer
  # cross-checked against the walk it replaces: a disagreement asserts. Run on
  # both backends, since the index follows compaction, which is an atomic
  # replace on UBI and the scratch protocol on flash_area, and with large
  # payloads, whose segment and sweep paths append through the same hook. The
  # raw-partition injections in the flash_area run are what prove a hit is
  # checked against flash rather than trusted.
  lib.blob_db.slot_index:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      # native_sim's 4 KB erase blocks make 2 038 buckets.
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  lib.blob_db.slot_index.ubi:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      # native_sim's 4 KB erase blocks make 2 038 buckets.
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  lib.blob_db.slot_index.large_payloads:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_LARGE_PAYLOADS=y
      - CONFIG_MAIN_STACK_SIZE=32768
      - CONFIG_BLOB_DB_TEST_CRASH_HOOKS=y
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      # native_sim's 4 KB erase blocks make 2 038 buckets.
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  # A table far too small for the suite: most ids miss and walk, and every
  # insert into a full table must be refused rather than evict a live entry.
  lib.blob_db.slot_index.tiny:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      # native_sim's 4 KB erase blocks make 2 038 buckets.
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_ENTRIES=64
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  # Authenticated and encrypted storage (CONFIG_BLOB_DB_PROTECT,
  # doc/proposals/2026-10-15-blob-db-protection.md). The whole suite runs over
  # a protected store; the raw-partition cases of src/main.c skip (their
  # offsets are the unprotected layout) and src/protect.c forges slots,
  # headers and masters in the protected one instead, on flash_area.
  lib.blob_db.protect_auth:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_PROTECT_AUTH=y
  lib.blob_db.protect_aead:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_PROTECT_AEAD=y
      # Records every nonce, to show none is used twice.
      - CONFIG_BLOB_DB_TEST_PROTECT_HOOKS=y
  # Also builds the shell, whose `dump` shows an encrypted slot as stored.
  lib.blob_db.protect_aead.tag16:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_PROTECT_AEAD=y
      - CONFIG_BLOB_DB_PROTECT_TAG_16=y
      - CONFIG_BLOB_DB_TEST_PROTECT_HOOKS=y
      - CONFIG_SHELL=y
      - CONFIG_BLOB_DB_SHELL=y
  # Segment slots keep their owner in the clear (AAD) and the sweep walks
  # them; index records are resealed by compaction like any slot.
  lib.blob_db.protect_aead.large_payloads:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_PROTECT_AEAD=y
      - CONFIG_BLOB_DB_TEST_PROTECT_HOOKS=y
      - CONFIG_BLOB_DB_LARGE_PAYLOADS=y
      - CONFIG_BLOB_DB_TEST_CRASH_HOOKS=y
  # A compacted slot reached through the index reads its nonce base from the
  # bucket header; each answer is cross-checked against the walk.
  lib.blob_db.protect_aead.slot_index:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_PROTECT_AEAD=y
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  # On UBI, one application key feeds UBI and blob_db under separate labels,
  # and compaction is an atomic replace: the nonce range it reserves is
  # persisted by a master write of its own.
  lib.blob_db.protect_aead.ubi:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_KEY_APP=y
      - CONFIG_BLOB_DB_PROTECT_AEAD=y
      - CONFIG_BLOB_DB_TEST_PROTECT_HOOKS=y
  lib.blob_db.protect_auth.ubi.scratch_compaction:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_UBI_ATOMIC_REPLACE=n
      - CONFIG_BLOB_DB_PROTECT_AUTH=y
