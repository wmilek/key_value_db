common:
  tags: [storage, blob_db]
  platform_allow: native_sim
# blob_db defaults to the UBI backend, but most of this suite injects faults by
# writing the raw partition at offsets that are only blob_db's on flash_area
# (see SKIP_UNLESS_RAW_PARTITION in src/main.c). The first three scenarios
# therefore pin flash_area so the injection keeps its meaning; lib.blob_db.ubi
# runs the same suite on the shipped default with those cases skipping
# themselves. The backend is named per scenario rather than in `common` because
# the two are a Kconfig choice and must not both be set.
tests:
  lib.blob_db:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
  # Production policy for an unparseable-but-not-erased master: refuse with
  # -EIO instead of reformatting. Exercises the other half of the recovery
  # branch in blob_db_mount().
  lib.blob_db.no_autoformat:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_AUTOFORMAT_ON_CORRUPT=n
  # Segmented large objects. Bumps the on-flash format major, so this config
  # also covers that older software refuses such a store.
  lib.blob_db.large_payloads:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
      - CONFIG_BLOB_DB_LARGE_PAYLOADS=y
      - CONFIG_MAIN_STACK_SIZE=32768
      # Crash injection at each step of the segmented write sequence
      # (proposal §6.4). Kept in the same config as the rest of the
      # large-object tests so the commit-point claim is covered by the
      # config that ships it, not by a config nothing else uses.
      - CONFIG_BLOB_DB_TEST_CRASH_HOOKS=y
  # The shipped default: UBI, single-slot payloads. Everything that goes
  # through the API runs here; the raw-partition injection cases skip
  # themselves, because under UBI those offsets are UBI's device header rather
  # than blob_db's masters. Keeping this scenario means the default is
  # exercised by the library's own suite and not only by the apps.
  #
  # LARGE_PAYLOADS is deliberately absent, and cannot simply be added here:
  # UBI spends 128 B per PEB on its two headers, so the LEB blob_db sees is
  # 3968 B rather than 4096. The rebind rule caps a payload at
  # (3968 - 16) / 2 - 14 = 1962 B, while enabling LARGE_PAYLOADS raises
  # MAX_PAYLOAD_LEN to 2016 — mount then refuses with -ENOTSUP, correctly.
  # The pair is only reachable on this geometry by also lowering
  # MAX_PAYLOAD_LEN to <= 1962. The DK's 64 KB blocks have room to spare and
  # are unaffected, which is why app_perf runs both options there.
  lib.blob_db.ubi:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      # zephyr-ubi's own bookkeeping checks after every call: meant for
      # tests, and these are the scenarios that drive UBI hardest.
      - CONFIG_UBI_SELF_CHECKS=y
  # The same suite with the key supplied by the application, as a product
  # would: src/ubi.c defines blob_db_ubi_ikm_key() and overrides the weak
  # blob_db_ubi_state_check(), which turns on the cases that hand blob_db
  # a wrong key and a refused rollback check.
  lib.blob_db.ubi.app_key:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      # zephyr-ubi's own bookkeeping checks after every call: meant for
      # tests, and these are the scenarios that drive UBI hardest.
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_UBI_KEY_APP=y
  # Compaction by ubi_leb_change() instead of the scratch-sector protocol
  # (CONFIG_BLOB_DB_UBI_ATOMIC_REPLACE).
  lib.blob_db.ubi.atomic_replace:
    extra_configs:
      - CONFIG_BLOB_DB_BACKEND_UBI=y
      # zephyr-ubi's own bookkeeping checks after every call: meant for
      # tests, and these are the scenarios that drive UBI hardest.
      - CONFIG_UBI_SELF_CHECKS=y
      - CONFIG_BLOB_DB_UBI_ATOMIC_REPLACE=y
