common:
  tags: storage blob_db
  platform_allow: native_sim
tests:
  lib.blob_db: {}
  # Production policy for an unparseable-but-not-erased master: refuse with
  # -EIO instead of reformatting. Exercises the other half of the recovery
  # branch in blob_db_mount().
  lib.blob_db.no_autoformat:
    extra_configs:
      - CONFIG_BLOB_DB_AUTOFORMAT_ON_CORRUPT=n
  # Segmented large objects. Bumps the on-flash format major, so this config
  # also covers that older software refuses such a store.
  lib.blob_db.large_payloads:
    extra_configs:
      - CONFIG_BLOB_DB_LARGE_PAYLOADS=y
      - CONFIG_MAIN_STACK_SIZE=32768
      # Crash injection at each step of the segmented write sequence
      # (proposal §6.4). Kept in the same config as the rest of the
      # large-object tests so the commit-point claim is covered by the
      # config that ships it, not by a config nothing else uses.
      - CONFIG_BLOB_DB_TEST_CRASH_HOOKS=y
