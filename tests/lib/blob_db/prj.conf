CONFIG_ZTEST=y
CONFIG_BLOB_DB=y

# The corrupted-slot test bit-flips an already-written byte to simulate
# real-flash bit-rot; sim-flash refuses that by default.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# Compaction holds two 4 KB scratch buffers nested under a 4 KB bucket
# buffer; bump stack and ztest thread stack to fit.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
