CONFIG_ZTEST=y

# blob_db is switched on by the kvdb,blob-db node in boards/<board>.overlay.
CONFIG_BLOB_ROOTREG=y
CONFIG_BLOBDB_KVDB=y
# kvhash is the default backend; selected implicitly, stated here for clarity.
CONFIG_BLOB_CONTAINER_KVHASH=y

# blob_db compaction nests two 4 KB scratch buffers under a 4 KB bucket buffer.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_LOG=y
