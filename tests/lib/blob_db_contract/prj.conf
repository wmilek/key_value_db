CONFIG_ZTEST=y
# blob_db is switched on by the kvdb,blob-db node in boards/<board>.overlay.
CONFIG_BLOB_ROOTREG=y

# Compaction nests two 4 KB scratch buffers under a 4 KB bucket buffer;
# bump stacks to fit (same as the L1 unit suite).
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_LOG=y
