# UBI static PEB pool. blob_db defaults to the UBI backend, and UBI's static
# memory backend sizes its slab pool at compile time: this suite's 8 MB
# partition in the simulator's default 4 KB erase blocks is 2048 PEBs, less
# CONFIG_UBI_DEV_HDR_NR_OF_RES_PEBS (2). Without this the default of 14 builds
# cleanly and then fails to attach the device at runtime.
CONFIG_UBI_MAX_NR_OF_DATA_PEBS=2046
