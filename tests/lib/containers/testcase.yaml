common:
  tags: [storage, containers, map_ops, kvhash]
  platform_allow: native_sim
tests:
  lib.containers: {}
  # The same suite over blob_db's RAM slot index, each indexed answer
  # cross-checked against the walk.
  lib.containers.slot_index:
    extra_configs:
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      # native_sim's 4 KB erase blocks make about 2 000 buckets.
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
  # The same suite with detach-on-update forced on for every update (draft,
  # doc/proposals/2026-11-07-kvhash-detach-on-update.md): the contract must
  # hold whatever the placement.
  lib.containers.detach:
    extra_configs:
      - CONFIG_BLOB_CONTAINER_KVHASH_DETACH_ON_UPDATE=y
      - CONFIG_BLOB_CONTAINER_KVHASH_DETACH_MIN_LEN=0
  # The slot index as a 16-entry CLOCK cache under the containers: kvhash's
  # directories, buckets and spilled parts compete for it and are evicted all
  # the time, with every indexed answer cross-checked against the walk.
  lib.containers.slot_index.clock:
    extra_configs:
      - CONFIG_BLOB_DB_SLOT_INDEX=y
      - CONFIG_BLOB_DB_SLOT_INDEX_MAX_BUCKETS=2048
      - CONFIG_BLOB_DB_SLOT_INDEX_ENTRIES=16
      - CONFIG_BLOB_DB_SLOT_INDEX_CLOCK=y
      - CONFIG_BLOB_DB_SLOT_INDEX_VERIFY=y
      - CONFIG_ASSERT=y
