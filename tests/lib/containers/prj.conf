CONFIG_ZTEST=y

CONFIG_BLOB_DB=y

# Providers under test. The contract suite runs against every one that is
# built in, so enabling kvlist/kvtree here is all it takes to cover them.
CONFIG_BLOB_CONTAINER_KVHASH=y

# No kvdb, no rootreg: L2 is tested without its L3 consumer, which is the
# point of having a shape header at all.

# blob_db compaction nests two 4 KB scratch buffers under a 4 KB bucket buffer.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_LOG=y
