CONFIG_ZTEST=y
CONFIG_BLOB_DB=y
CONFIG_BLOB_CONTAINER_LOGRING=y

# Small checkpoint interval so a handful of appends exercises checkpoints,
# tail rebuild on remount, and batched eviction.
CONFIG_BLOB_CONTAINER_LOGRING_CHECKPOINT=4

# Same stack sizing rationale as the blob_db / rootreg suites.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
