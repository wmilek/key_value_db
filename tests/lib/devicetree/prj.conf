CONFIG_ZTEST=y

# blob_db is switched on by the kvdb,blob-db node in base.overlay;
# each scenario in testcase.yaml layers one variation of it on top.
CONFIG_BLOB_ROOTREG=y

# blob_db_inspect_info_get() answers -ENODEV instead of mounting, which is
# how the suite observes whether the store is mounted without changing it.
CONFIG_BLOB_DB_INSPECT=y

# blob_db stack-allocates sector-sized buffers; with "automount" the mount
# runs in the init thread before main(), on the main stack.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_LOG=y
