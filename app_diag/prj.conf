# kvdb diagnostics app: the storage stack plus the shell commands that already
# exist for it. The app adds no commands of its own.
#
# Copyright (c) 2026
# SPDX-License-Identifier: Apache-2.0

# A diagnostics build compiles in the stack's debug messages, which a product
# build leaves out: mount's master classification, recovery decisions, UBI
# attach. They are on from boot; `log enable <level> <module>` turns a module
# down at run time.
#
# Immediate mode: each message is printed by the call that logs it, so it
# lands before the shell's reply to the command that caused it, and a burst of
# debug output is not dropped from a full buffer.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4
CONFIG_APP_DIAG_LOG_LEVEL_DBG=y
CONFIG_BLOB_DB_LOG_LEVEL_DBG=y
CONFIG_UBI_LOG_LEVEL_DBG=y

# The store, on the default backend (UBI with the built-in key). An image is
# readable only by a build that agrees with the one that wrote it on the
# backend, the UBI key and every option that changes the on-flash format
# (BLOB_DB_LARGE_PAYLOADS, BLOB_DB_MAX_PAYLOAD_LEN); match those to the
# firmware whose store is being inspected.
CONFIG_BLOB_DB=y

# Nothing in the build may write the partition on its own. The store is
# mounted by `blob_db mount`, or at boot only with
# CONFIG_APP_DIAG_MOUNT_AT_BOOT (default n); a corrupt one
# is never reformatted; no work item runs maintenance in the background; and
# blobfs is left out, since its file-system registration is another way to a
# mount.
CONFIG_BLOB_DB_AUTOFORMAT_ON_CORRUPT=n
CONFIG_BLOB_DB_MAINT_WORK=n

# The existing command groups.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="kvdb:~$ "
# blob_db info|stats|buckets|bucket|id|dump|maintain
CONFIG_BLOB_DB_SHELL=y
# blob_db iostats
CONFIG_BLOB_DB_IOSTATS=y
# blob_db mount|unmount|format yes
CONFIG_BLOB_DB_SHELL_ADMIN=y
# flash read|write|erase|... on the raw device
CONFIG_FLASH_SHELL=y
# kernel threads|stacks|uptime, device list
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
# kernel reboot cold|warm. Not an unmount: the store sees what it would see
# after a power cut between operations. On native_sim the process re-runs
# itself with the same arguments, so --kvdb=<file> and its content carry over.
CONFIG_REBOOT=y

# Export reads each object 32 bytes at a time, and without an index every
# blob_db_read() walks the object's whole bucket, one 12-byte read per slot:
# on a 13k-object store that is ~800 MB read to export 4.6 MB. With the slot
# index the first lookup of an object walks once and the rest go straight to
# its slot. It is a cache of hints (CLOCK keeps the ids in use; only the
# object being exported needs to stay), every hit is checked against flash,
# and nothing about it is written: it changes no answer and no byte on the
# store. Walks and known-offset reads fetch 512 bytes at a time instead of
# one slot header or one field per flash command. RAM: 3 KB of index plus
# 1.5 KB of bucket cursors.
CONFIG_BLOB_DB_SLOT_INDEX=y
CONFIG_BLOB_DB_SLOT_INDEX_CLOCK=y
CONFIG_BLOB_DB_SLOT_INDEX_ENTRIES=256
CONFIG_BLOB_DB_WALK_CHUNK=512
CONFIG_BLOB_DB_READ_WINDOW=512

# `blob_db maintain` with a budget runs UBI relocations, and their AES-CMAC,
# on the shell thread.
CONFIG_SHELL_STACK_SIZE=16384

# A mount at boot runs on main: UBI attach plus blob_db's master and bucket
# scan, the same work app_perf_blob_db gives 32 KB.
CONFIG_MAIN_STACK_SIZE=32768
