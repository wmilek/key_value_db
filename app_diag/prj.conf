# kvdb diagnostics app: the storage stack plus the shell commands that already
# exist for it. The app adds no commands of its own.
#
# Copyright (c) 2026
# SPDX-License-Identifier: Apache-2.0

CONFIG_LOG=y
CONFIG_APP_DIAG_LOG_LEVEL_INF=y

# The store, on the default backend (UBI with the built-in key). An image is
# readable only by a build that agrees with the one that wrote it on the
# backend, the UBI key and every option that changes the on-flash format
# (BLOB_DB_LARGE_PAYLOADS, BLOB_DB_MAX_PAYLOAD_LEN); match those to the
# firmware whose store is being inspected.
CONFIG_BLOB_DB=y
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y

# Nothing in the build may write the partition on its own. The store is
# mounted by `blob_db mount`, or at boot only with
# CONFIG_APP_DIAG_MOUNT_AT_BOOT (default n); a corrupt one
# is never reformatted; no work item runs maintenance in the background; and
# blobfs is left out, since its file-system registration is another way to a
# mount.
CONFIG_BLOB_DB_AUTOFORMAT_ON_CORRUPT=n
CONFIG_BLOB_DB_MAINT_WORK=n

# The existing command groups.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="kvdb:~$ "
# blob_db info|stats|buckets|bucket|id|dump|maintain
CONFIG_BLOB_DB_SHELL=y
# blob_db iostats
CONFIG_BLOB_DB_IOSTATS=y
# blob_db mount|unmount|format yes
CONFIG_BLOB_DB_SHELL_ADMIN=y
# flash read|write|erase|... on the raw device
CONFIG_FLASH_SHELL=y
# kernel threads|stacks|uptime, device list
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
# kernel reboot cold|warm. Not an unmount: the store sees what it would see
# after a power cut between operations. On native_sim the process re-runs
# itself with the same arguments, so --kvdb=<file> and its content carry over.
CONFIG_REBOOT=y

# `blob_db maintain` with a budget runs UBI relocations, and their AES-CMAC,
# on the shell thread.
CONFIG_SHELL_STACK_SIZE=16384

# A mount at boot runs on main: UBI attach plus blob_db's master and bucket
# scan, the same work app_perf_blob_db gives 32 KB.
CONFIG_MAIN_STACK_SIZE=32768
