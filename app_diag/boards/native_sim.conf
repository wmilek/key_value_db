# The shell on the terminal native_sim was started from, not on a pty, so the
# host build is used like any command-line tool; commands can also be piped in.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Program-over-programmed (1->0 only) is legal on the NOR this geometry
# models; the flash simulator refuses it unless told otherwise.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# The overlay gives the store's flash the DK's 64 KB erase blocks; blob_db
# refuses to mount a sector larger than its sector buffer.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# zephyr-ubi's heap: 8 B per erase block (128 of 64 KB, so 1 KB) plus a
# handle and scratch buffer at attach and a second pair during a format.
CONFIG_BLOB_DB_UBI_HEAP_SIZE=6144

# The native log backend already prints to the terminal the shell is on; the
# shell's own log backend would print every line a second time.
CONFIG_SHELL_LOG_BACKEND=n
