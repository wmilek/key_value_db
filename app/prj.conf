# This file contains selected Kconfig options for the application.

CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# blob_db library (stable-id blob store).
CONFIG_BLOB_DB=y

# blob_db storage backend. Default is the raw partition (flash_area). To run
# blob_db on a UBI volume instead, select the UBI backend — it selects
# CONFIG_UBI_ENABLE automatically. On native_sim's 8 MB / 4 KB partition the
# UBI device has ~2046 PEBs, so size the static pool to match, e.g.:
#   west build -b native_sim app -- \
#       -DCONFIG_BLOB_DB_BACKEND_UBI=y -DCONFIG_UBI_MAX_NR_OF_DATA_PEBS=2046
# CONFIG_BLOB_DB_BACKEND_FLASH_AREA=y  # (default)

# blob_db stack-allocates a 4 KB bucket buffer per op, and during
# compaction allocates a second 4 KB scratch buffer nested under it.
# 32 KB gives plenty of headroom for native_sim's frame overhead.
CONFIG_MAIN_STACK_SIZE=32768
