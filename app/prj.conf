# This file contains selected Kconfig options for the application.

CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# blob_db library (stable-id blob store).
CONFIG_BLOB_DB=y

# blob_db stack-allocates a 4 KB bucket buffer in each get/put/update/
# delete call; bump main stack to give it room.
CONFIG_MAIN_STACK_SIZE=8192
