# This file contains selected Kconfig options for the application.

CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# blob_db library (stable-id blob store).
CONFIG_BLOB_DB=y

# blob_db storage backend. The default is a UBI volume, for wear-leveling and
# bad-block handling; CONFIG_UBI_ENABLE comes with it. The static PEB pool must
# match the geometry, which is why boards/*.conf set
# CONFIG_UBI_MAX_NR_OF_DATA_PEBS (2046 on native_sim's 4 KB blocks, 126 on the
# DK's 64 KB). To run on the raw partition instead — faster, but no
# wear-leveling and no bad-block handling — select the flash_area backend:
#   west build -b native_sim app -- -DCONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
# The two on-flash layouts are not interchangeable; erase the partition when
# switching an existing device between them.
# CONFIG_BLOB_DB_BACKEND_UBI=y  # (default)

# blob_db stack-allocates a 4 KB bucket buffer per op, and during
# compaction allocates a second 4 KB scratch buffer nested under it.
# 32 KB gives plenty of headroom for native_sim's frame overhead.
CONFIG_MAIN_STACK_SIZE=32768
