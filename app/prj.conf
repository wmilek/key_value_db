# This file contains selected Kconfig options for the application.

CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# blob_db (stable-id blob store) needs no line here: the kvdb,blob-db node in
# boards/<board>.overlay switches it on, says where the store lives and
# mounts it at boot ("automount").
#
# The storage backend follows the node's "storage" property: a UBI volume
# (zephyr-ubi) for wear-leveling, bad-block handling and authenticated
# metadata, or a plain partition for the raw flash_area backend — faster, but
# no wear-leveling and no bad-block handling. CONFIG_UBI and PSA Crypto come
# with UBI, and its heap is sized from the partition
# (CONFIG_BLOB_DB_UBI_HEAP_SIZE). The overlays here use a UBI volume; to run
# the same partition raw instead, override the backend:
#   west build -b native_sim app -- -DCONFIG_BLOB_DB_BACKEND_FLASH_AREA=y
# The two on-flash layouts are not interchangeable; erase the partition when
# switching an existing device between them.

# blob_db stack-allocates a 4 KB bucket buffer per op, and during
# compaction allocates a second 4 KB scratch buffer nested under it.
# 32 KB gives plenty of headroom for native_sim's frame overhead.
CONFIG_MAIN_STACK_SIZE=32768
