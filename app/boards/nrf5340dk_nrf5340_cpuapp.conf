# Board-specific Kconfig for nRF5340-DK cpuapp: the storage_partition sits
# on the on-board MX25R64 QSPI NOR (see nrf5340dk_nrf5340_cpuapp.overlay),
# whose sectors are 64 KB. Grow blob_db's sector buffer to fit.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# zephyr-ubi's heap: 8 B per erase block (128 of 64 KB here, so 1 KB) plus a
# handle and scratch buffer at attach and a second pair during a format. The
# default assumes 4 KB blocks and would reserve 20 KB.
CONFIG_HEAP_MEM_POOL_ADD_SIZE_BLOB_DB_UBI=6144
