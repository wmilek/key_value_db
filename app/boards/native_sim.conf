# blob_db_erase_all() invalidates bucket headers by programming 0x00 over
# already-programmed magic bytes (1->0 only — legal on real NOR without an
# erase). The flash simulator rejects program-over-non-erased by default;
# allow it so the demo's every-Nth-boot erase_all works on native_sim.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
