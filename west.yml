manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: kamil-kielbasa
      url-base: https://github.com/kamil-kielbasa

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6    # required by the ARM port for Cortex-M
          - hal_nordic # required by the custom_plank board (Nordic based)
          - hal_stm32  # required by the nucleo_f302r8 board (STM32 based)
          - zcbor      # CBOR codec used by app_cbor_persondb (CONFIG_ZCBOR)
          # PSA Crypto provider for zephyr-ubi, which seals its metadata with
          # AES-CMAC under HKDF-SHA256-derived keys (CONFIG_PSA_CRYPTO).
          - mbedtls
          - tf-psa-crypto
    # UBI flash-virtualization layer — provides the wear-leveled volume
    # substrate that the key-value store builds on (CONFIG_BLOB_DB_BACKEND_UBI).
    # Pinned to a release tag: the on-flash format and the API are versioned
    # by it, and the backend in lib/blob_db/blob_db_store_ubi.c is written
    # against exactly this one.
    - name: zephyr-ubi
      remote: kamil-kielbasa
      revision: v0.1.3
      path: modules/lib/zephyr-ubi
