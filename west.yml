manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: kamil-kielbasa
      url-base: https://github.com/kamil-kielbasa
    - name: wmilek
      url-base: https://github.com/wmilek

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6    # required by the ARM port for Cortex-M
          - hal_nordic # required by the custom_plank board (Nordic based)
          - hal_stm32  # required by the nucleo_f302r8 board (STM32 based)
    # UBI flash-virtualization layer — provides the wear-leveled volume
    # substrate that the key-value store builds on. The UBI backend needs the
    # in-place partial-update API (ubi_leb_write_at) and the "compile only when
    # enabled" build guard, which live on this branch pending the upstream PR
    # (kamil-kielbasa/ubi). Flip back to a kamil-kielbasa release tag once it
    # lands.
    - name: ubi
      remote: wmilek
      revision: feature/leb-partial-update
      path: ubi
